type User
  @model(
    mutations: { create: null, update: "updateUser", delete: "deleteUser" }
  )
  @searchable
  @auth(
    rules: [
      { allow: public, operations: [read] }
      # We need this private rule to allow the lambda functions to create users for the mobile app, as owner isn't enough because at sign up they don't have an owner yet
      { allow: private, operations: [create, read] }
      { allow: owner, operations: [create, read, update, delete] }
      {
        allow: groups
        groups: ["Admin"]
        provider: userPools
        operations: [create, read, update, delete]
      }
      # BrandOwner/BrandEditor only get read+update, not create/delete
      # Note: Due to Amplify limitation, nullAllowedFields won't be populated
      # for these groups. The frontend filters out null values as a workaround.
      {
        allow: groups
        groups: ["BrandOwner", "BrandEditor"]
        provider: userPools
        operations: [read, update]
      }
    ]
  ) {
  id: ID!
  personFirstName: String
  personLastName: String
  personFullName: String
  venueName: String
  venueSearchName: String
  venuePhone: String
  venueAddressCountry: String
  venueAddressCity: String
  venueAddressStreet: String
  venueAddressNumber: String
  venueAddressState: String
  venueAddressGeo: GeoPoint
  venueCalculatedRating: Int
  venueMenu: S3Object
  venueCheckinsCount: Int
  venueWebsite: String
  venueHours: String
  brandName: String
  brandSearchName: String
  brandDescription: String
  brandLogo: S3Object
  brandCoverImage: S3Object
  brandWebsite: String
  brandCountry: String
  brandFoundedYear: Int
  brandStory: String
  brandId: ID @index(name: "byBrandVenues")
  userType: UserType!
  username: String! @index(name: "byUsername")
  profilePicture: S3Object
  profilePictureKey: String @index(name: "byProfilePictureKey")
  profilePictureModerationStatus: ModerationStatus
  coverPicture: S3Object
  coverPictureKey: String @index(name: "byCoverPictureKey")
  coverPictureModerationStatus: ModerationStatus
  bio: String
  notificationSettings: [Settings]
  securitySettings: [Settings]
  deleted: Boolean
  archived: Boolean
  isMyCollectionPublic: Boolean
  whiskeys: [UserWhiskeys] @hasMany(indexName: "byUserWhiskey")
  reviews: [Review] @hasMany(indexName: "byUser")
  likedPosts: [Post] @manyToMany(relationName: "userLikes")
  posts: [Post] @hasMany(indexName: "byPostAuthor")
  comments: [Comment] @hasMany(indexName: "byCommentAuthor")
  wishList: [Whiskey] @manyToMany(relationName: "userWishListWhiskeys")
  trendingWhiskeys: [UserTrendingWhiskeys]
    @hasMany(indexName: "byUserTrendingWhiskey")
  followers: [String]
  following: [String]
  expoTokens: [String]
  relatedNotifications: [Notification] @hasMany(indexName: "byRelatedUserId")
  reports: [Report] @hasMany
  rewards: [UserReward] @hasMany(indexName: "byReward")
  isOnRewards: Boolean
  favoriteGuides: [Guides] @manyToMany(relationName: "userFavoriteGuides")
  myPours: [UserPours] @hasMany(indexName: "byUserPours")
  brandWhiskeys: [Whiskey] @hasMany(indexName: "byBrand")
  brandVenues: [User] @hasMany(indexName: "byBrandVenues", fields: ["id"])
  cmsUsers: [CMSUserBrand] @hasMany(indexName: "byBrandUser")
  blockedUsers: [String]
  toBeRedeemed: Boolean
  externalId: String
  clubMembers: [ClubMember] @hasMany(indexName: "byUserClubMember")
  clubRequestsCreated: [ClubRequest] @hasMany(indexName: "byRequestedBy")
  dmPrivacySetting: DMPrivacySetting
  conversationParticipants: [ConversationParticipant]
    @hasMany(indexName: "byUser")
  messages: [Message] @hasMany(indexName: "bySender")
}

type UserPours
  @model
  @searchable
  @auth(
    rules: [
      {
        allow: groups
        groups: ["Admin"]
        provider: userPools
        operations: [create, read, update, delete]
      }
      { allow: private, operations: [create, read] }
      { allow: owner, operations: [create, update, read, delete] }
    ]
  ) {
  userId: ID! @index(name: "byUserPours", sortKeyFields: ["whiskeyFullName"])
  user: User @belongsTo(fields: ["userId"])
  whiskeyFullName: String
  count: Int
  whiskeyId: ID! @index(name: "byWhiskeyUserPours")
  whiskey: Whiskey @belongsTo(fields: ["whiskeyId"])
}

