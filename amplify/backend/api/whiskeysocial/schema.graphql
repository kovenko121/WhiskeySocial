type Whiskey
  @model
  @searchable
  @auth(
    rules: [
      {
        allow: groups
        groups: ["Admin", "BrandOwner", "BrandEditor"]
        provider: userPools
        operations: [create, read, update, delete]
      }
      { allow: private, operations: [read] }
    ]
  ) {
  id: ID!
  name: String @index
  description: String
  type: [WhiskeyType]
  picture: S3Object
  brandId: ID @index(name: "byBrand")
  brandUser: User @belongsTo(fields: ["brandId"])
  brand: String @index
  brandPicture: S3Object
  age: Int
  calculatedRating: Float
  awards: [WhiskeyAwards]
  users: [UserWhiskeys] @hasMany(indexName: "byWhiskeyUser")
  usersWhishList: [User] @manyToMany(relationName: "userWishListWhiskeys")
  userTrendingWhiskeys: [UserTrendingWhiskeys]
    @hasMany(indexName: "byTrendingWhiskey")
  reviews: [Review] @hasMany(indexName: "byWhiskey")
