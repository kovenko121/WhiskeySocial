# ═══════════════════════════════════════════════════════════════
# TASTING PASSPORT
# Event-day passport: CMS-authored events/booths/pours (read-only to
# the app) + per-attendee passport state (owner-scoped) + a live,
# event-scoped bottle leaderboard.
#
# NOTE: the existing `Event` type is ad-campaign analytics — unrelated.
# These models are intentionally prefixed `Tasting*` to avoid it.
# ═══════════════════════════════════════════════════════════════

enum TastingEventStatus {
  DRAFT # being built in CMS, invisible to the app
  SCHEDULED # finalized; publishAt holds the go-live time
  PUBLISHED # live in the app now
  ARCHIVED # past / hidden
}

type TastingEvent
  @model
  @auth(
    rules: [
      {
        allow: groups
        groups: ["Admin"]
        provider: userPools
        operations: [create, read, update, delete]
      }
      # Event content is browsable in guest mode (API key) — the passport is a
      # sign-up funnel at the doors, so the roster must not need an account.
      # Only the curated content is public; every passport state model stays owner-scoped.
      { allow: public, operations: [read] }
      { allow: private, operations: [read] }
    ]
  ) {
  id: ID!
  title: String!
  # Free text: the LOCATION line. The date used to live here too; it now has its
  # own fields below, and this stays as written for venue and any loose detail.
  description: String
  image: S3Object # hero image, uploaded like a brand logo
  # The venue floor plan, and the host's own booth number for the "find us"
  # callout beside it. Both nullable: an event with no map uploaded simply has no
  # map section in the passport guide, which is how the section is switched off.
  mapImage: S3Object
  hostBoothNumber: String
  status: TastingEventStatus!
  publishAt: AWSDateTime # go-live time when SCHEDULED
  # When the doors open and when they shut. Both nullable and unindexed, so adding
  # them is additive — existing rows simply carry neither and keep the old
  # publish-plus-a-day window. `startsAt` gates stamping, not listing: an event is
  # browsable from its go-live so a roster can be read before the doors open.
  # `endsAt` is what moves it to Past Events.
  startsAt: AWSDateTime
  endsAt: AWSDateTime
  booths: [TastingBooth] @hasMany(indexName: "byEvent")
}

type TastingBooth
  @model
  @auth(
    rules: [
      {
        allow: groups
        groups: ["Admin"]
        provider: userPools
        operations: [create, read, update, delete]
      }
      { allow: public, operations: [read] } # guest mode; see TastingEvent
      { allow: private, operations: [read] }
    ]
  ) {
  id: ID!
  eventId: ID! @index(name: "byEvent", sortKeyFields: ["order"])
  event: TastingEvent @belongsTo(fields: ["eventId"])
  # Link back to the source brand (a `User` record). Null = custom booth.
  # Plain ref (no @belongsTo) to avoid adding a @hasMany to the hot User type.
  brandRefId: ID @index(name: "byBrandBooth") # == brand User.id
  brandSyncedAt: AWSDateTime # set by the CMS "Sync now" action
  # Snapshot fields: seeded from the brand, then editable in CMS ("excel row").
  # These are what the APP reads — offline-friendly, no live brand fetch.
  name: String!
  logo: S3Object
  description: String
  # Home location ("Kentucky, USA"), NOT a position at the venue — it is seeded
  # from the brand's country and shown on the distiller page.
  location: String
  # The stand's number on the printed floor plan, which is what the map's
  # directory lists. Free text, because plans number stands "12A" as readily as
  # "12". A booth without one is absent from the directory, not numbered zero.
  boothNumber: String
  order: Int
  pours: [TastingPour] @hasMany(indexName: "byBooth")
}

type TastingPour
  @model
  @auth(
    rules: [
      {
        allow: groups
        groups: ["Admin"]
        provider: userPools
        operations: [create, read, update, delete]
      }
      { allow: public, operations: [read] } # guest mode; see TastingEvent
      { allow: private, operations: [read] }
    ]
  ) {
  id: ID!
  boothId: ID! @index(name: "byBooth", sortKeyFields: ["order"])
  booth: TastingBooth @belongsTo(fields: ["boothId"])
  # Catalogue bottle; null = custom bottle hand-added for this event.
  whiskeyRefId: ID @index(name: "byWhiskeyPour") # == Whiskey.id
  # Leaderboard identity: whiskeyRefId when linked, else normalize(brand+name).
  # Computed at curation and editable, so the CMS can force merge/split.
  bottleKey: ID! @index(name: "byBottleKeyPour")
  # Snapshot fields (from Whiskey or hand-entered), editable in CMS.
  name: String!
  brand: String
  tag: String
  proof: Float
  rating: Float
  picture: S3Object
  order: Int
}

# --- Per-attendee passport state. owner-scoped; never touches User records. ---
# The app composes a deterministic `id` (e.g. `${ownerSub}:${eventId}:${boothId}`)
# so optimistic offline writes upsert idempotently and never collide across users.

type TastingBoothState
  @model
  @auth(
    rules: [
      { allow: owner, operations: [create, read, update, delete] }
      {
        allow: groups
        groups: ["Admin"]
        provider: userPools
        operations: [read]
      }
    ]
  ) {
  id: ID!
  eventId: ID! @index(name: "byEventBoothState")
  boothId: ID! @index(name: "byBoothState")
  want: Boolean
  went: Boolean # the stamp / "Visited"
  fav: Boolean
  notes: String # private, <=2000 chars
  shareEmail: Boolean # lead-gen opt-in; null = untouched
}

type TastingPourState
  @model
  @auth(
    rules: [
      { allow: owner, operations: [create, read, update, delete] }
      {
        allow: groups
        groups: ["Admin"]
        provider: userPools
        operations: [read]
      }
    ]
  ) {
  id: ID!
  eventId: ID! @index(name: "byEventPourState")
  boothId: ID! @index(name: "byBoothPourState")
  pourId: ID! @index(name: "byPourState") # the concrete TastingPour tapped
  bottleKey: ID! @index(name: "byBottleKeyState") # copied from the pour; leaderboard group key
  tasted: Boolean
  fav: Boolean
}

# --- Per-user, per-event attendance header. The clean "user attended event X"
# record and the passport-dedicated home for the lead contact snapshot (name +
# email), captured only with consent — NEVER read from the user's app record.
# TastingBoothState / TastingPourState hang under it (same owner + eventId).
# Extensible: future sweepstakes entries, check-in, totals attach here. ---

type TastingAttendance
  @model
  @auth(
    rules: [
      { allow: owner, operations: [create, read, update, delete] }
      {
        allow: groups
        groups: ["Admin"]
        provider: userPools
        operations: [read]
      }
    ]
  ) {
  id: ID! # `${ownerSub}:${eventId}` — one per user per event
  eventId: ID! @index(name: "byEventAttendance")
  displayName: String # snapshot captured with consent
  email: String # the lead email; cleared to null on opt-out
  # Event-level sharing switch. Absent/true = sharing (the default); false = the
  # attendee explicitly opted out, and `displayName`/`email` are nulled with it.
  # Distinguishes "opted out" from "row not written yet" without re-deriving.
  shareContact: Boolean
  joinedAt: AWSDateTime
  stampCount: Int # denormalized # of booths visited (cheap CMS reporting)
}

# --- Live leaderboard. Incremented in real time by a DynamoDB stream on
# TastingPourState. The app reads it and subscribes to onUpdate. ---

type TastingLeaderboardCounter
  @model
  @auth(
    rules: [
      { allow: private, operations: [read] }
      {
        allow: groups
        groups: ["Admin"]
        provider: userPools
        operations: [create, read, update, delete]
      }
    ]
  ) {
  id: ID! # `${eventId}:${bottleKey}`
  eventId: ID! @index(name: "byEventLeaderboard")
  bottleKey: ID!
  whiskeyRefId: ID # null for custom bottles
  bottleName: String
  brand: String
  count: Int!
  updatedAt: AWSDateTime
}

# --- Per-user passport prefs (onboarding dismissal, per-user not per-device).
# `id` == the user's Cognito sub, one row per user. ---

type TastingUserPref
  @model
  @auth(rules: [{ allow: owner, operations: [create, read, update, delete] }]) {
  id: ID!
  onboardedAt: AWSDateTime
}