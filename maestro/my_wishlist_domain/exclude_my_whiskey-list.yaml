- tapOn:
    id: "Done"
- tapOn:
    id: "add-to-my-collection"
- tapOn:
    id: "star-4"
- tapOn:
    id: "title-your-review"
- inputText: "Uisque de cana de açucar"
- tapOn:
    id: "Done"
- tapOn:
    id: "leave-your-review"
- inputText: "Tentando degustar cachaça, e achando que é uisque"
