    speed: 90
- tapOn: "15 Stars Private Stock Bourbon  0"
- tapOn:
    id: "--wishlist"
- swipe:
    start: "85%,50%"
    end: "33%,48%"
    duration: 1178
- tapOn: .*291 Fresh Un-Aged.*
- tapOn:
    id: "+-my-collection"
- tapOn:
    id: "age"
- inputText: "12"
- tapOn:
    id: "Done"
- tapOn:
    id: "batch-#"
- inputText: "453/2020"
- tapOn:
    id: "Done"
- tapOn:
    id: "bottle-#"
- inputText: "750-2012"
- tapOn:
    id: "barrel-#"
