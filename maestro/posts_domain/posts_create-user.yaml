- waitForAnimationToEnd:
    timeout: 2500   
- runFlow: 
    when:
      notVisible: "Congratulations"
    commands:
      - runFlow: '../auth_domain/logout.yaml'
      - tapOn: 
          id: "continue"
      - runFlow: '../auth_domain/login_google.yaml'
- runFlow: 
    when:
      visible: "Congratulations"
    commands:
      - runFlow: '../activity_domain/congratulations.yaml'

- runFlow:
    when:
      true: ${RECORD_MODE == 'each'}
    commands:
      - stopRecording

